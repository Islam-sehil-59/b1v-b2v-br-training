# ==========================================================================
# Configuration Netlify
# Site entièrement statique : aucune dépendance, aucune étape de build.
# Netlify sert les fichiers du dépôt tels quels.
# ==========================================================================

[build]
  # La racine du dépôt EST le site : index.html est à la racine.
  publish = "."
  # Pas de commande de build : rien à compiler, rien à installer.
  command = ""

# --------------------------------------------------------------------------
# EN-TÊTES DE CACHE
#
# Attention : index.html référence css/style.css et js/*.js par leur nom, SANS
# empreinte (pas de style.a1b2c3.css). Un cache long servirait donc d'anciens
# fichiers après une mise à jour, avec un mélange de versions incohérent.
#
# On demande donc au navigateur de REVALIDER à chaque visite : il envoie un
# ETag, et Netlify répond « 304 Not Modified » si rien n'a changé. Le transfert
# reste quasi nul, mais une mise en ligne est visible immédiatement.
#
# Si un jour les fichiers sont renommés avec une empreinte, on pourra passer
# css/ et js/ à « public, max-age=31536000, immutable ».
# --------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    # --- Sécurité ---
    # Empêche le navigateur de « devenir » le type MIME annoncé.
    X-Content-Type-Options = "nosniff"
    # Interdit l'affichage du site dans une iframe d'un autre domaine.
    X-Frame-Options = "DENY"
    # Ne transmet pas l'URL complète aux sites tiers.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # L'application n'a besoin d'aucune API sensible : on les refuse toutes.
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    # Politique de sécurité du contenu : tout vient de ce domaine, rien de l'extérieur.
    #   script-src 'self'            → uniquement les fichiers js/ du projet
    #   style-src  'unsafe-inline'   → nécessaire : l'application pose quelques
    #                                  attributs style="..." depuis JavaScript
    #   img-src    data:             → nécessaire : l'icône d'onglet est un SVG en data:
    #   connect-src 'none'           → l'application ne fait AUCUNE requête réseau
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# --------------------------------------------------------------------------
# FICHIERS DE RÉFÉRENCEMENT
#
# Mêmes fichiers sans empreinte que ci-dessus, donc même décision : on
# revalide plutôt que de servir une version périmée. robots.txt et
# sitemap.xml n'ont aucun intérêt à être mis en cache long (une
# modification mettrait des jours à se voir), et og-carte.jpg non plus
# tant qu'il ne porte pas d'empreinte dans son nom.
# --------------------------------------------------------------------------

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/og-carte.jpg"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# --------------------------------------------------------------------------
# MANIFESTE ET ICÔNES
#
# Un manifeste servi en text/plain est refusé par Chrome : le type MIME
# fait partie de ce qu'il valide. On le fixe donc explicitement.
# --------------------------------------------------------------------------

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# --------------------------------------------------------------------------
# ICÔNES DE L'ÉCRAN D'ACCUEIL
#
# Ces fichiers ne changent presque jamais, mais ils n'ont pas d'empreinte
# dans leur nom : même règle que ci-dessus, on revalide plutôt que de
# servir une ancienne version.
# --------------------------------------------------------------------------

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/icon-192.png"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/icon-512.png"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# --------------------------------------------------------------------------
# PAS DE REDIRECTION « /* vers /index.html »
#
# On pourrait être tenté d'en ajouter une, comme pour une application à page
# unique. C'est inutile ici : la navigation entre les modes se fait en mémoire,
# sans jamais changer l'URL. Ajouter cette règle masquerait au contraire les
# vraies erreurs 404 (un fichier mal nommé renverrait la page d'accueil au lieu
# de signaler le problème).
# --------------------------------------------------------------------------
